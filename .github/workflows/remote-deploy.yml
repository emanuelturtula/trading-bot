name: Remote deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialization is done by the host lock in deploy/deploy.py, so pending jobs are never
    # silently replaced by GitHub's concurrency groups.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Join tailnet (OIDC, ephemeral)
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:trading-bot-ci
      - name: Deploy and verify health
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_IMAGE: ${{ inputs.image }}
          DEPLOY_VERSION: ${{ inputs.version }}
          DEPLOY_REVISION: ${{ github.sha }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/remote_deploy.py
      - name: Summary
        env:
          TARGET: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ inputs.image }}
        run: |
          printf 'Verified **%s**: `%s`\n\nImage: `%s`\n' "$TARGET" "$VERSION" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
