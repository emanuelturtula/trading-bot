; Developer CLI only (spec 012, D76). The application builds its Alembic configuration in
; code (persistence/migrator.py), so this file is never read at runtime and is not copied
; into the image. Use it to create revisions and read the history:
;
;   uv run alembic revision --autogenerate --rev-id 0002 -m "add the tickers table"
;   uv run alembic history
;
; There is deliberately no sqlalchemy.url and no logging configuration here: the database is
; the one the settings choose (TB_DATA_DIR), and env.py never installs logging handlers.

[alembic]
script_location = src/trading_bot/persistence/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
