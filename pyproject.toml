[project]
name = "trading-bot"
# The released version comes from git tags (scripts/next_version.py) and is injected
# into the image as TB_VERSION. This static value is only a placeholder.
version = "0.0.0"
description = "Technical-analysis signal bot that notifies buy/sell signals via Telegram. Never places orders."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "alembic>=1.13",
    "exchange-calendars>=4.13.2",
    "fastapi>=0.115",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "ta-lib>=0.8.0",
    "uvicorn>=0.30",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "hypothesis>=6.168.0",
    "jsonschema>=4.26.0",
    "mypy>=1.11",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "deploy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "S", "SIM", "PT", "RUF", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["trading_bot", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "S101", "S105", "S106", "S108", "S603", "S607"]
"scripts/**" = ["S603", "S607", "T201"]
"deploy/**" = ["S603", "S607", "T201"]
".claude/hooks/**" = ["S603", "S607", "T201"]

[tool.mypy]
python_version = "3.12"
platform = "linux"
strict = true
files = ["src", "scripts", "deploy", ".claude/hooks", "tests/lookahead.py", "tests/fixtures"]
mypy_path = "src"
explicit_package_bases = true
untyped_calls_exclude = ["yfinance"]

[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
pythonpath = ["src", "."]

[tool.coverage.run]
# The package name plus the directory Alembic loads its scripts from: coverage matches a
# package name against the module name, and the revisions are loaded outside the package
# (spec 013, D89), so without the second entry they appear in no report line.
source = ["trading_bot", "src/trading_bot/persistence/migrations"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
