[project]
name = "trading-bot"
# The released version comes from git tags (scripts/next_version.py) and is injected
# into the image as TB_VERSION. This static value is only a placeholder.
version = "0.0.0"
description = "Technical-analysis signal bot that notifies buy/sell signals via Telegram. Never places orders."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "hypothesis>=6.168.0",
    "mypy>=1.11",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "deploy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "S", "SIM", "PT", "RUF", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["trading_bot", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "S101", "S105", "S106", "S108", "S603", "S607"]
"scripts/**" = ["S603", "S607", "T201"]
"deploy/**" = ["S603", "S607", "T201"]
".claude/hooks/**" = ["S603", "S607", "T201"]

[tool.mypy]
python_version = "3.12"
platform = "linux"
strict = true
files = ["src", "scripts", "deploy", ".claude/hooks", "tests/lookahead.py", "tests/fixtures"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["trading_bot"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
