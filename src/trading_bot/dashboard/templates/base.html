<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{% if not production %}[BETA] {% endif %}{% block title %}Dashboard{% endblock %} · trading-bot</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --line: #dfe3ea;
  --accent: #2457c5; --ok-bg: #e5f4ea; --ok: #1f6b3a; --err-bg: #fbe8e8; --err: #9b2222;
  --on: #1f6b3a; --off: #8a909c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171d; --panel: #1c2028; --text: #e6e9ef; --muted: #9aa3b2; --line: #2d333e;
    --accent: #7aa2ff; --ok-bg: #173323; --ok: #8fd6a6; --err-bg: #3a1c1c; --err: #f2a3a3;
    --on: #8fd6a6; --off: #7b8290;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); }
header .bar { max-width: 1000px; margin: 0 auto; padding: 10px 16px; display: flex;
  flex-wrap: wrap; gap: 6px 18px; align-items: center; }
header .brand { font-weight: 600; margin-right: auto; }
header .brand small { color: var(--muted); font-weight: 400; }
nav a { color: var(--text); text-decoration: none; margin-right: 14px; }
nav a:hover { color: var(--accent); }
main { max-width: 1000px; margin: 0 auto; padding: 18px 16px 40px; }
h1 { font-size: 22px; margin: 0 0 14px; }
h2 { font-size: 17px; margin: 22px 0 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
.muted { color: var(--muted); }
.flash { border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
.flash.ok { background: var(--ok-bg); color: var(--ok); }
.flash.error { background: var(--err-bg); color: var(--err); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 13px; color: var(--muted); font-weight: 600; }
.table-wrap { overflow-x: auto; }
.on { color: var(--on); font-weight: 600; }
.off { color: var(--off); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
form.inline { display: inline; margin: 0; }
button, .button { font: inherit; font-size: 14px; padding: 5px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--text); text-decoration: none; display: inline-block; }
button.primary, .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--err); border-color: var(--err); }
input[type=text], input[type=password], select, textarea { font: inherit; padding: 6px 8px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text); }
textarea { width: 100%; min-height: 420px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.stat .value { font-size: 22px; font-weight: 600; }
.problems { color: var(--err); margin: 0 0 12px; padding-left: 18px; }
.split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
@media (max-width: 760px) { .split { grid-template-columns: 1fr; } }
.catalog dt { font-weight: 600; margin-top: 8px; }
.catalog dd { margin: 0 0 4px; color: var(--muted); font-size: 13px; }
code { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
label { cursor: pointer; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">{% if not production %}[BETA] {% endif %}trading-bot <small>{{ version }} · {{ environment }}</small></span>
    {% if signed_in %}
    <nav>
      <a href="{{ prefix }}/">Overview</a>
      <a href="{{ prefix }}/tickers">Tickers</a>
      <a href="{{ prefix }}/rules">Rules</a>
    </nav>
    <form class="inline" method="post" action="{{ prefix }}/logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit">Log out</button>
    </form>
    {% endif %}
  </div>
</header>
<main>
{% if flash %}<div class="flash {{ flash.level }}">{{ flash.text }}</div>{% endif %}
{% block content %}{% endblock %}
<p class="muted">Signals only: this bot never places orders. Not financial advice.</p>
</main>
</body>
</html>
